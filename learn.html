<title>두우리 프랑스어 · 8주 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
/* ════════════════════════════════════════════════════════════
   learn.html — 강의 수강 플랫폼 (웹·모바일 한 파일)
   주소 하나(/learn)에서 화면 폭에 따라 모양만 바뀝니다.
     1024px 이상  : 왼쪽 사이드바 + 넓은 본문
     1023px 이하  : 사이드바 대신 하단 탭바
     640px 이하   : 휴대폰 배치 (한 줄, 여백 16px)
   ════════════════════════════════════════════════════════════ */
:root{
  --brick:#C24A35; --brick-h:#A83D2C; --brick-soft:#FFF7F5; --brick-line:rgba(194,74,53,.22);
  --dark:#2E0E0C; --surface:#FAF7F6; --white:#fff;
  --border:#ECE4E1; --muted:#8C7F7A; --ink:#3A2A26;
  --green:#2B9C4E; --peach:#F4A47A;
  --font-heading:'Gowun Batang', Georgia, serif;
  --font-body:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --top-h:60px; --sidebar:236px; --maxw:1180px; --tab-h:62px;
  --pad:34px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ══ 상단 바 ══ */
.topbar{position:sticky;top:0;z-index:100;height:var(--top-h);background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:var(--maxw);margin:0 auto;height:100%;display:flex;align-items:center;gap:14px;padding:0 26px}
.logo{font-family:var(--font-heading);font-weight:700;font-size:1.05rem;color:var(--dark);letter-spacing:-.01em;white-space:nowrap}
.logo span{color:var(--brick)}
.cohort-pill{font-size:.72rem;font-weight:700;color:var(--brick);background:var(--brick-soft);border:1px solid var(--brick-line);padding:5px 11px;border-radius:999px;white-space:nowrap}
.top-spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;display:none;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink)}
.icon-btn:hover{background:var(--surface)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:999px;background:var(--brick);border:2px solid #fff}
.mode-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;flex-shrink:0}
.mode-btn{font-size:.74rem;font-weight:700;padding:6px 14px;border-radius:999px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
.mode-btn.active{background:var(--dark);color:#fff}
.top-user{display:flex;align-items:center;gap:9px}
.top-ava{width:34px;height:34px;border-radius:999px;background:linear-gradient(135deg,#d9724f,#C24A35);color:#fff;font-weight:700;font-size:.76rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-uname{font-size:.8rem;font-weight:700;color:var(--dark);white-space:nowrap}
.top-urole{font-size:.66rem;color:var(--muted)}

/* ══ 레이아웃 ══ */
.shell{display:flex;max-width:var(--maxw);margin:0 auto;align-items:flex-start}
.sidebar{width:var(--sidebar);flex-shrink:0;position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));padding:22px 14px;overflow-y:auto}
.side-group-label{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin:6px 0 8px}
.side-group-label.gap{margin-top:18px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink);font-size:.86rem;font-weight:600;cursor:pointer;transition:.12s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--white)}
.nav-item.active{background:var(--brick-soft);color:var(--brick);font-weight:700}
.nav-item .badge{margin-left:auto;font-size:.62rem;font-weight:800;background:var(--brick);color:#fff;border-radius:999px;padding:1px 7px}
.side-card{margin-top:18px;background:var(--dark);border-radius:14px;padding:15px 16px;color:#fff}
.side-card .sc-l{font-size:.62rem;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.side-card .sc-big{font-family:var(--font-heading);font-size:1.4rem;font-weight:700;margin:3px 0 8px}
.side-card .sc-big em{color:var(--peach);font-style:normal}
.bar{height:6px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brick);border-radius:3px}
.side-card .sc-sub{font-size:.66rem;color:rgba(255,255,255,.55);margin-top:7px}
.side-home{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;font-size:.76rem;color:var(--muted);border-radius:10px}
.side-home:hover{color:var(--brick);background:var(--white)}

.main{flex:1;min-width:0;padding:28px var(--pad) 64px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:22px}
.page-title{font-family:var(--font-heading);font-size:1.5rem;font-weight:700;color:var(--dark);margin:0 0 4px;line-height:1.3}
.page-desc{font-size:.86rem;color:var(--muted);margin:0}

/* ══ 하단 탭바 (1023px 이하) ══ */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:flex;max-width:640px;margin:0 auto;height:var(--tab-h)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:.64rem;font-weight:700;position:relative;-webkit-tap-highlight-color:transparent}
.tab svg.i{width:21px;height:21px}
.tab.active{color:var(--brick)}
.tab .tbadge{position:absolute;top:7px;left:calc(50% + 6px);font-size:.54rem;font-weight:800;background:var(--brick);color:#fff;border-radius:999px;padding:1px 5px;line-height:1.3}

/* ══ 공통 ══ */
.card{background:var(--white);border:1px solid var(--border);border-radius:14px}
.sect-title{font-family:var(--font-heading);font-size:1.05rem;font-weight:700;color:var(--dark);margin:30px 0 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sect-title .link{font-family:var(--font-body);font-size:.74rem;font-weight:700;color:var(--brick);cursor:pointer;background:none;border:none;padding:0;white-space:nowrap}
.sect-title .note{font-family:var(--font-body);font-size:.72rem;font-weight:500;color:var(--muted)}
.btn{border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:.8rem;padding:10px 16px;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--brick);color:#fff}
.btn-primary:hover{background:var(--brick-h)}
.btn-dark{background:var(--dark);color:#fff}
.btn-ghost{background:var(--white);color:var(--dark);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--brick);color:var(--brick)}
.btn-sm{padding:7px 13px;font-size:.74rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;font-size:.8rem;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 대시보드 ── */
.hero{background:var(--dark);border-radius:16px;padding:26px 28px;color:#fff;margin-bottom:16px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.hero-greet{font-size:.76rem;color:rgba(255,255,255,.55)}
.hero-name{font-family:var(--font-heading);font-size:1.5rem;font-weight:700;line-height:1.38;margin:6px 0 20px}
.hero-name em{color:var(--peach);font-style:normal}
.hero-stats{display:flex;gap:28px}
.hstat-n{font-family:var(--font-heading);font-size:1.9rem;font-weight:700;line-height:1}
.hstat-n small{font-size:.85rem;color:rgba(255,255,255,.5)}
.hstat-l{font-size:.66rem;color:rgba(255,255,255,.5);font-weight:700;margin-top:6px;white-space:nowrap}
.level-strip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:15px 16px}
.level-lab{font-size:.62rem;color:rgba(255,255,255,.5);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.level-bar{display:flex;position:relative}
.level-line{position:absolute;top:11px;left:10%;right:10%;height:2px;background:rgba(255,255,255,.12)}
.level-line i{display:block;height:100%;background:var(--brick)}
.level-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;min-width:0}
.level-dot{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700}
.ld-done{background:var(--brick);color:#fff}
.ld-cur{background:var(--brick);color:#fff;box-shadow:0 0 0 4px rgba(194,74,53,.35)}
.ld-lock{background:#4a2c29;color:rgba(255,255,255,.4)}
.level-nm{font-size:.6rem;color:rgba(255,255,255,.5);white-space:nowrap}
.level-nm.cur{color:var(--peach);font-weight:700}

.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dday-card{background:var(--brick-soft);border:1px solid var(--brick-line);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px}
.dday-n{font-family:var(--font-heading);font-size:1.7rem;font-weight:700;color:var(--brick);line-height:1;white-space:nowrap}
.dday-n small{font-size:.8rem}
.dday-info{flex:1;min-width:0}
.dday-t{font-size:.9rem;font-weight:700;color:var(--dark)}
.dday-s{font-size:.74rem;color:var(--muted);margin-top:3px}
.continue-card{background:var(--white);border:1.5px solid var(--brick);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px}
.cc-body{flex:1;min-width:0}
.cc-lab{font-size:.62rem;font-weight:800;color:var(--brick);text-transform:uppercase;letter-spacing:.06em}
.cc-week{font-size:.72rem;color:var(--muted);margin:5px 0 2px}
.cc-title{font-family:var(--font-heading);font-size:.98rem;font-weight:700;color:var(--dark);line-height:1.4}
.cc-play{width:46px;height:46px;border-radius:999px;background:var(--brick);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.cc-play svg{width:18px;height:18px;fill:#fff;margin-left:3px}
.notice-mini{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-top:16px;cursor:pointer}
.notice-mini:hover{border-color:var(--brick)}
.notice-mini .t{flex:1;min-width:0;font-size:.82rem;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 학습 여정 */
.journey-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
.jweek{background:var(--white);border:1px solid var(--border);border-radius:13px;overflow:hidden;transition:.15s}
.jweek.cur{border-color:var(--brick)}
.jweek.lock .jweek-head{opacity:.62}
.jweek-head{padding:14px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;width:100%;background:none;border:none;text-align:left}
.jbadge{width:28px;height:28px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.jb-done{background:var(--brick);color:#fff}
.jb-cur{background:var(--brick);color:#fff;box-shadow:0 0 0 3px rgba(194,74,53,.25)}
.jb-lock{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.jw-info{flex:1;min-width:0}
.jw-t{font-size:.84rem;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jw-s{font-size:.68rem;color:var(--muted);margin-top:2px}
.jdots{display:flex;gap:4px}
.jdot{width:7px;height:7px;border-radius:999px}
.jd-done{background:var(--brick)}.jd-cur{background:var(--brick);box-shadow:0 0 0 2.5px rgba(194,74,53,.2)}
.jd-next{background:rgba(194,74,53,.2)}.jd-lock{background:var(--border)}
.jchev{color:var(--muted);font-size:.7rem;transition:.2s}
.jweek.open .jchev{transform:rotate(180deg)}
.jchapters{display:none;border-top:1px solid var(--border)}
.jweek.open .jchapters{display:block}
.jch{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--surface);cursor:pointer}
.jch:last-child{border-bottom:none}
.jch:hover{background:var(--surface)}
.cn{width:23px;height:23px;border-radius:6px;flex-shrink:0;font-size:.64rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.cn-done{background:var(--brick);color:#fff}.cn-cur{background:var(--brick-soft);color:var(--brick);border:1.5px solid var(--brick)}.cn-lock{background:var(--surface);color:var(--muted)}
.jch-t{font-size:.78rem;color:var(--ink);flex:1;line-height:1.4;min-width:0}
.jch-t.dim{color:var(--muted)}
.miss-tag{font-size:.62rem;font-weight:700;color:var(--brick);background:rgba(194,74,53,.08);padding:2px 7px;border-radius:999px;white-space:nowrap}

/* ── 강의실 ── */
.player-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.video-box{width:100%;aspect-ratio:16/9;background:#141010;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-box video{width:100%;height:100%;display:block;background:#000}
.big-play{width:64px;height:64px;border-radius:999px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:.15s}
.big-play:hover{background:rgba(255,255,255,.26)}
.big-play svg{width:24px;height:24px;fill:#fff;margin-left:4px}
.vplaceholder{position:absolute;bottom:14px;left:16px;right:16px;font-size:.72rem;color:rgba(255,255,255,.45)}
.player-meta{margin-top:16px}
.pm-week{font-size:.72rem;color:var(--muted)}
.pm-title{font-family:var(--font-heading);font-size:1.18rem;font-weight:700;color:var(--dark);margin:4px 0 6px;line-height:1.4}
.pm-sub{font-size:.8rem;color:var(--muted);margin:0 0 14px}
.pm-nav{display:flex;gap:8px;margin-bottom:18px}
.pm-nav .btn{flex:1}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{padding:10px 14px;font-size:.82rem;font-weight:700;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.ptab.active{color:var(--dark);border-bottom-color:var(--brick)}
.ptab-body{display:none}.ptab-body.active{display:block}
.mat{display:flex;align-items:center;gap:13px;padding:13px 15px;background:var(--white);border:1px solid var(--border);border-radius:11px;margin-bottom:9px}
.mat-ic{font-size:1.15rem;flex-shrink:0}
.mat-info{flex:1;min-width:0}
.mat-nm{font-size:.82rem;font-weight:700;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-sz{font-size:.68rem;color:var(--muted)}
.note-txt{font-size:.86rem;line-height:1.9;color:var(--ink);margin:0}
.chlist-panel{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:6px;max-height:calc(100vh - var(--top-h) - 48px);overflow-y:auto;position:sticky;top:calc(var(--top-h) + 20px)}
.chl-head{font-size:.7rem;font-weight:800;color:var(--dark);padding:12px 12px 8px;display:flex;justify-content:space-between}
.chl-head span{color:var(--muted);font-weight:600}
.chl-wk{width:100%;display:flex;align-items:center;gap:8px;padding:11px 10px;border:none;background:none;cursor:pointer;border-radius:9px;text-align:left}
.chl-wk:hover{background:var(--surface)}
.chl-wk b{font-size:.74rem;color:var(--dark);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chl-wk small{font-size:.64rem;color:var(--muted);white-space:nowrap}
.chl-wk .jchev{margin-left:2px}
.chl-group .chl-rows{display:none;padding-bottom:4px}
.chl-group.open .chl-rows{display:block}
.chl-group.open .jchev{transform:rotate(180deg)}
.chl{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer}
.chl:hover{background:var(--surface)}
.chl.playing{background:var(--brick-soft)}
.chl.locked{cursor:default}
.chl.locked:hover{background:none}
.chl-info{flex:1;min-width:0}
.chl-nm{font-size:.76rem;color:var(--ink);line-height:1.35}
.chl-nm.dim{color:var(--muted)}
.chl-dur{font-size:.64rem;color:var(--muted);margin-top:1px}

/* ── 미션 ── */
.mcard{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}
.mcard-head{padding:16px 20px;background:var(--dark);color:#fff}
.mch-wk{font-size:.66rem;color:rgba(255,255,255,.55)}
.mch-t{font-family:var(--font-heading);font-size:1rem;font-weight:700;margin-top:3px;line-height:1.45}
.mbadge{display:inline-block;margin-top:9px;font-size:.62rem;font-weight:700;padding:3px 10px;border-radius:999px}
.mb-pending{background:rgba(255,255,255,.13);color:rgba(255,255,255,.75)}
.mb-done{background:rgba(43,156,78,.22);color:#6fd89a}
.mb-open{background:var(--brick);color:#fff}
.mcard-body{padding:18px 20px}
.mdesc{font-size:.84rem;line-height:1.85;margin:0 0 16px;color:var(--ink)}
.upzone{border:2px dashed var(--border);border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;margin-bottom:12px;background:var(--white);width:100%;display:block}
.upzone:hover{border-color:var(--brick);background:var(--brick-soft)}
.upzone .ic{font-size:1.6rem}
.upzone .t{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.6}
.upzone .t strong{color:var(--brick)}
.fb-box{padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--brick);border-radius:0 12px 12px 0}
.fb-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.ava{border-radius:999px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ava-30{width:30px;height:30px;font-size:.68rem}
.ava-20{width:20px;height:20px;font-size:.56rem}
.ava-34{width:34px;height:34px;font-size:.74rem}
.fb-nm{font-size:.8rem;font-weight:700;color:var(--dark)}
.fb-dt{font-size:.66rem;color:var(--muted)}
.fb-txt{font-size:.83rem;line-height:1.8;color:var(--ink)}

/* ── Q&A ── */
.qa-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:.76rem;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.qa-search{flex:1;min-width:200px;max-width:300px;margin-left:auto}
.qa-search input{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:9px;font-size:.82rem;font-family:inherit;outline:none;background:var(--white)}
.qa-search input:focus{border-color:var(--brick)}
.qa-actions{display:flex;justify-content:flex-end;margin-bottom:14px}
.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.12s;display:flex;gap:14px;text-align:left;width:100%}
.qrow:hover{border-color:var(--brick);box-shadow:0 3px 14px rgba(46,14,12,.05)}
.q-votes{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:40px;color:var(--muted)}
.q-ans-count{font-family:var(--font-heading);font-size:1.15rem;font-weight:700;line-height:1}
.q-ans-count.has{color:var(--green)}
.q-ans-lab{font-size:.6rem;font-weight:700}
.q-body{flex:1;min-width:0}
.q-cat{display:inline-block;font-size:.62rem;font-weight:700;color:var(--brick);background:var(--brick-soft);padding:2px 8px;border-radius:999px;margin-bottom:6px}
.q-cat.free{color:#6a5acd;background:#f0eefc}
.q-title{font-size:.9rem;font-weight:700;color:var(--dark);margin-bottom:5px;line-height:1.45}
.q-excerpt{font-size:.78rem;color:var(--muted);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.q-meta{display:flex;align-items:center;gap:6px 8px;margin-top:9px;font-size:.7rem;color:var(--muted);flex-wrap:wrap}
.q-solved{margin-left:auto;font-size:.64rem;font-weight:700;color:var(--green);background:rgba(43,156,78,.1);padding:2px 9px;border-radius:999px;white-space:nowrap}
.q-solved.t{color:var(--brick);background:var(--brick-soft)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:.84rem;background:var(--white);border:1px dashed var(--border);border-radius:12px}
.back-link{font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:16px;display:inline-flex;align-items:center;gap:5px;background:none;border:none;padding:4px 0}
.back-link:hover{color:var(--brick)}
.qdetail{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px 26px;margin-bottom:18px}
.qd-title{font-family:var(--font-heading);font-size:1.25rem;font-weight:700;color:var(--dark);margin:8px 0 12px;line-height:1.4}
.qd-meta{display:flex;align-items:center;gap:6px 9px;font-size:.74rem;color:var(--muted);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.qd-content{font-size:.88rem;line-height:1.9;color:var(--ink);white-space:pre-wrap;word-break:keep-all}
.ans-head{font-family:var(--font-heading);font-size:1.05rem;font-weight:700;color:var(--dark);margin:6px 0 14px}
.ans{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.ans.teacher{border-color:var(--brick-line);background:var(--brick-soft)}
.ans.accepted{border-color:rgba(43,156,78,.35)}
.ans-top{display:flex;align-items:center;gap:8px 10px;margin-bottom:10px;flex-wrap:wrap}
.ans-nm{font-size:.84rem;font-weight:700;color:var(--dark)}
.ans-role{font-size:.62rem;font-weight:700;padding:1px 8px;border-radius:999px}
.role-teacher{background:var(--brick);color:#fff}
.role-student{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.ans-dt{font-size:.68rem;color:var(--muted);margin-left:auto}
.ans-txt{font-size:.85rem;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:keep-all}
.ans-tip{background:var(--white);border-left:3px solid var(--brick);border-radius:0 8px 8px 0;padding:11px 14px;margin-top:12px;font-size:.84rem;color:var(--dark);line-height:1.7}
.ans-actions{display:flex;gap:14px;margin-top:12px;font-size:.72rem;color:var(--muted)}
.ans-act{cursor:pointer;background:none;border:none;padding:0;font-size:inherit;color:inherit}
.ans-act:hover{color:var(--brick)}
.accepted-tag{font-size:.64rem;font-weight:700;color:var(--green);background:rgba(43,156,78,.1);padding:2px 9px;border-radius:999px;margin-left:auto}
.composer{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:6px}
textarea.field,input.field{width:100%;border:1px solid var(--border);border-radius:9px;padding:12px;font-family:inherit;font-size:.86rem;outline:none;background:var(--white);color:var(--ink)}
textarea.field{min-height:92px;resize:vertical;line-height:1.7}
.field:focus{border-color:var(--brick)}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.composer-hint{font-size:.72rem;color:var(--muted)}

/* ── 크루 랭킹 ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 14px;text-align:center}
.stat.hi{border-color:var(--brick);background:var(--brick-soft)}
.stat-n{font-family:var(--font-heading);font-size:1.6rem;font-weight:700;color:var(--dark);line-height:1}
.stat.hi .stat-n{color:var(--brick)}
.stat-l{font-size:.68rem;color:var(--muted);margin-top:6px;font-weight:700}
.top-cert{background:linear-gradient(120deg,#fff7f0,#fdeee6);border:1px solid var(--brick-line);border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:16px}
.tc-fire{font-size:1.6rem}
.tc-info{flex:1;min-width:0}
.tc-lab{font-size:.68rem;font-weight:700;color:var(--brick)}
.tc-name{font-family:var(--font-heading);font-size:1.15rem;font-weight:700;color:var(--dark);margin-top:2px}
.tc-count{text-align:right}
.tc-count b{font-family:var(--font-heading);font-size:1.7rem;color:var(--brick)}
.tc-count span{font-size:.7rem;color:var(--muted);display:block}
.rank-table{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.rank-thead{display:flex;align-items:center;gap:14px;padding:11px 20px;background:var(--surface);font-size:.68rem;font-weight:800;color:var(--muted)}
.rank-row{display:flex;align-items:center;padding:13px 20px;border-top:1px solid var(--border);gap:14px}
.rank-row.me{background:var(--brick-soft)}
.rk-num{width:26px;font-family:var(--font-heading);font-weight:700;font-size:.95rem;color:var(--muted);text-align:center;flex-shrink:0}
.rk-num.top{color:var(--brick)}
.rk-name{font-size:.86rem;font-weight:700;color:var(--dark);flex:1;min-width:0}
.rk-name .me-tag{font-size:.62rem;color:#fff;background:var(--brick);border-radius:999px;padding:1px 7px;font-weight:700;margin-left:6px;vertical-align:1px}
.rk-name .site{display:block;font-size:.66rem;color:var(--muted);font-weight:500;margin-top:1px}
.rk-prog{display:flex;align-items:center;gap:11px;width:240px;flex-shrink:0}
.pbar{flex:1;height:7px;background:var(--surface);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.pbar i{display:block;height:100%;background:var(--brick);border-radius:4px}
.rk-frac{font-size:.76rem;font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.foot-note{font-size:.72rem;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}

/* ── 공지 ── */
.notice{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:10px}
.n-top{display:flex;align-items:center;gap:6px 9px;margin-bottom:6px;flex-wrap:wrap}
.n-pin{font-size:.62rem;font-weight:700;color:#fff;background:var(--brick);padding:2px 8px;border-radius:999px}
.n-t{font-size:.9rem;font-weight:700;color:var(--dark)}
.n-dt{font-size:.7rem;color:var(--muted);margin-left:auto}
.n-ex{font-size:.8rem;color:var(--muted);line-height:1.65}

/* ── 운영자 ── */
.stu-table{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.stu-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--border)}
.stu-row:first-child{border-top:none}
.stu-name{font-size:.86rem;font-weight:700;color:var(--dark);width:120px;flex-shrink:0}
.stu-prog{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.stu-prog .pbar{max-width:260px}
.stu-tags{display:flex;gap:8px;align-items:center;justify-content:flex-end;width:170px;flex-shrink:0}
.stu-tag{font-size:.7rem;color:var(--muted)}
.stu-tag strong{color:var(--dark)}
.miss-badge{font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--brick-soft);color:var(--brick);white-space:nowrap}
.rv-head{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--dark);color:#fff}
.rv-head .mch-t{font-size:.92rem;margin:0}
.rv-btns{display:flex;gap:8px;margin-top:10px}
.rv-btns .btn{flex:1}

/* 강의 업로드 */
.up-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.wk-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.wk-tabs::-webkit-scrollbar{display:none}
.up-list{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:6px}
.up-ch{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:9px;cursor:pointer;width:100%;border:none;background:none;text-align:left}
.up-ch:hover{background:var(--surface)}
.up-ch.sel{background:var(--brick-soft)}
.up-st{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-ok{color:var(--green);background:rgba(43,156,78,.1)}
.st-no{color:var(--muted);background:var(--surface);border:1px solid var(--border)}
.up-panel{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px}
.up-sel{font-family:var(--font-heading);font-size:1.02rem;font-weight:700;color:var(--dark);margin-bottom:4px;line-height:1.4}
.up-sel-sub{font-size:.76rem;color:var(--muted);margin-bottom:16px}
.up-label{font-size:.72rem;font-weight:700;color:var(--dark);margin:16px 0 8px}


/* ══ 강의실 v2 — 1주차 실제 콘텐츠 기준 ══ */
.speed-row{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.speed-row .lab{font-size:.7rem;color:var(--muted);font-weight:700;margin-right:2px}
.spd{font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer}
.spd.active{background:var(--dark);border-color:var(--dark);color:#fff}
.resume{font-size:.74rem;color:var(--brick);font-weight:700;background:var(--brick-soft);border:1px solid var(--brick-line);border-radius:999px;padding:5px 11px;cursor:pointer;margin-left:auto}
.video-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.7);font-size:.8rem;text-align:center;padding:20px;line-height:1.6}

.pm-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-bottom:16px}
.pill{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--green);background:rgba(43,156,78,.08);border-color:rgba(43,156,78,.25)}
.pill.brick{color:var(--brick);background:var(--brick-soft);border-color:var(--brick-line)}

/* 학습 순서 */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.step{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:var(--brick-line)}
.step-n{width:24px;height:24px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.step.done .step-n{background:var(--brick);border-color:var(--brick);color:#fff}
.step-t{font-size:.8rem;font-weight:700;color:var(--dark);line-height:1.3}
.step-s{font-size:.68rem;color:var(--muted);margin-top:3px;line-height:1.45}

/* 자료 블록 */
.block{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;scroll-margin-top:calc(var(--top-h) + 14px)}
.block-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.block-ic{font-size:1.2rem;line-height:1.2}
.block-t{font-family:var(--font-heading);font-size:1rem;font-weight:700;color:var(--dark)}
.block-s{font-size:.74rem;color:var(--muted);margin-top:2px;line-height:1.5}
.mat .acts{display:flex;gap:6px;flex-shrink:0}
.mat{background:var(--surface)}

/* 학습지 카드 */
.fiche{border:1.5px solid var(--brick);background:linear-gradient(180deg,#fff 0%,#fffaf8 100%)}
.fiche-top{display:grid;grid-template-columns:172px minmax(0,1fr);grid-template-areas:"cover head" "cover idea" "cover btns";column-gap:18px;row-gap:12px;align-content:start}
.fiche-top .f-cover{grid-area:cover}.fiche-top .f-head{grid-area:head;min-width:0}.fiche-top .fiche-idea{grid-area:idea;margin:0}.fiche-top .fiche-btns{grid-area:btns;margin:0;align-self:end}
.fiche-cover{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);box-shadow:0 6px 18px rgba(46,14,12,.10);background:#fff;cursor:pointer;aspect-ratio:210/297;display:block;padding:0}
.fiche-cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.fiche-cover .pg{position:absolute;right:6px;bottom:6px;font-size:.6rem;font-weight:800;background:rgba(46,14,12,.82);color:#fff;border-radius:999px;padding:2px 7px}
.fiche-kicker{font-size:.62rem;font-weight:800;color:var(--brick);letter-spacing:.06em}
.fiche-hook{font-family:var(--font-heading);font-size:1.12rem;font-weight:700;color:var(--dark);line-height:1.4;margin:4px 0 4px}
.fiche-sub{font-size:.74rem;color:var(--muted);line-height:1.5;font-style:italic}
.fiche-idea{margin-top:12px;background:var(--white);border:1px solid var(--border);border-left:3px solid var(--brick);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.8rem;color:var(--dark);line-height:1.6}
.fiche-idea b{display:block;font-size:.62rem;color:var(--brick);font-weight:800;margin-bottom:2px}
.fiche-flow{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--border)}
.fiche-flow li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.78rem;color:var(--ink);line-height:1.5}
.fiche-flow .pp{flex-shrink:0;width:52px;font-size:.66rem;font-weight:800;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.fiche-thumbs{display:flex;gap:8px;margin-top:14px}
.fiche-thumbs button{flex:1;padding:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;cursor:pointer;aspect-ratio:210/297;position:relative}
.fiche-thumbs .more{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--brick-soft);border-color:var(--brick-line);color:var(--brick);font-size:.78rem;font-weight:800}
.fiche-thumbs .more small{font-size:.66rem;font-weight:600;color:var(--muted)}
.fiche-thumbs img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.fiche-how{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.how{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.74rem;color:var(--ink);line-height:1.55}
.how b{display:block;font-size:.72rem;color:var(--dark);margin-bottom:2px}
.fiche-btns{display:flex;gap:8px;margin-top:14px}
.fiche-btns .btn{flex:1}

.complete-bar{display:flex;align-items:center;gap:14px;background:var(--dark);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px}
.complete-bar .t{flex:1;min-width:0;font-size:.84rem;line-height:1.5}
.complete-bar .t b{display:block;font-family:var(--font-heading);font-size:.98rem}
.complete-bar .t span{color:rgba(255,255,255,.6);font-size:.74rem}
.complete-bar.done{background:#eaf6ee;color:var(--dark);border:1px solid rgba(43,156,78,.3)}
.complete-bar.done .t span{color:var(--muted)}

/* 대시보드 복습 카드 */
.review-card{display:flex;gap:14px;align-items:center;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:16px;cursor:pointer;width:100%;text-align:left}
.review-card:hover{border-color:var(--brick)}
.review-card img{width:54px;border-radius:5px;border:1px solid var(--border);flex-shrink:0;aspect-ratio:210/297;object-fit:cover;object-position:top}
.review-card .rc-l{font-size:.62rem;font-weight:800;color:var(--brick);letter-spacing:.05em}
.review-card .rc-t{font-size:.86rem;font-weight:700;color:var(--dark);margin-top:3px;line-height:1.4}
.review-card .rc-s{font-size:.72rem;color:var(--muted);margin-top:2px}
.cc-thumb{width:44px;border-radius:4px;border:1px solid var(--border);aspect-ratio:210/297;object-fit:cover;object-position:top;flex-shrink:0}

.chl-tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.chl-tag{font-size:.56rem;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.chl-tag.f{color:var(--brick);background:var(--brick-soft);border-color:var(--brick-line)}
.dev-reset{display:block;margin:10px 12px 0;font-size:.66rem;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}

/* PDF 보기 */
.viewer{position:fixed;inset:0;z-index:300;background:rgba(20,10,8,.72);display:flex;flex-direction:column}
.viewer-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--dark);color:#fff}
.viewer-bar .t{flex:1;min-width:0;font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

 <div class="notice-mini" onclick="go('notice')">${ic('bell')}<span class="t">${esc(NOTICES[1].t)} — ${esc(NOTICES[1].ex)}</span><span style="font-size:.72rem;color:var(--muted);white-space:nowrap">공지 →</span></div>
 <div class="sect-title">나의 학습 여정 <button class="link" onclick="go('classroom')">강의실 →</button></div>
 <div class="journey-grid">${WEEKS.map(renderJWeek).join('')}</div>`;
}
function renderJWeek(w){
 const ns=w.chapters.map(c=>c[0]), cur=currentCh();
 const allDone=ns.every(isDone), isCur=ns.includes(cur)&&!allDone, isLock=!allDone&&!isCur&&ns.every(n=>!isOpen(n));
 const done=ns.filter(isDone).length;
 const ready=ns.some(n=>LESSONS[n]);
 const sub=allDone?'완료 ✓':isCur?`${done} / 5 강의`:ready?'열림':'준비 중';
 const dots=ns.map(n=>`<span class="jdot ${isDone(n)?'jd-done':n===cur?'jd-cur':isLock?'jd-lock':'jd-next'}"></span>`).join('');
 const chs=w.chapters.map(c=>{
  const st=chState(c[0]);
  const tag = LESSONS[c[0]] ? '<span class="miss-tag" style="background:var(--surface);color:var(--muted)">학습지</span>' : '';
  return `<div class="jch" onclick="openChapter(${c[0]})"><div class="cn cn-${st}">${st==='done'?'✓':c[0]}</div>
   <div class="jch-t ${st==='lock'?'dim':''}">${esc(c[1])}</div>${MISSION_CH.has(c[0])?'<span class="miss-tag">미션</span>':tag}</div>`;
 }).join('');
 return `<div class="jweek ${allDone?'':isCur?'cur':'lock'} ${isCur?'open':''}">
   <button class="jweek-head" onclick="this.parentElement.classList.toggle('open')">
     <span class="jbadge ${allDone?'jb-done':isCur?'jb-cur':'jb-lock'}">${allDone?'✓':w.n}</span>
     <span class="jw-info"><span class="jw-t" style="display:block">${w.n}주차 · ${esc(w.title)}</span><span class="jw-s" style="display:block">${sub}</span></span>
     <span class="jdots">${dots}</span><span class="jchev">▾</span></button>
   <div class="jchapters">${chs}</div></div>`;
}
let jumpTo=null;
function openChapter(n,anchor){
 if(!isOpen(n)){ toast(`${n}일차는 앞 강의를 끝내면 열려요 🔒`); return; }
 curPlaying=n; jumpTo=anchor||null;
 if(view==='classroom') show('classroom'); else go('classroom');
}

/* ════════════════ 강의실 ════════════════ */
function renderClassroom(){
 const cur=chInfo(curPlaying), L=LESSONS[cur.n];
 const url=L?mediaUrl(L.video):'';
 const video = url
  ? `<video id="vid" data-ch="${cur.n}" controls playsinline preload="metadata" src="${url}">${L.vtt?`<track kind="captions" srclang="ko" label="요약 자막" src="${mediaUrl(L.vtt)}" default>`:''}</video>`

 const opened=Object.keys(P.watched).length;

 const steps=`<div class="steps">

   <button class="step ${g?'done':''}" onclick="scrollToId('blk-guide')"><span class="step-n">${g?'✓':2}</span><span><span class="step-t" style="display:block">수업 자료</span><span class="step-s" style="display:block">강의 화면에 나오는 가이드</span></span></button>
   <button class="step ${f?'done':''}" onclick="scrollToId('blk-fiche')"><span class="step-n">${f?'✓':3}</span><span><span class="step-t" style="display:block">학습지로 복습</span><span class="step-s" style="display:block">여유 있을 때 요약 복습 · 문제 풀이</span></span></button>
 </div>`;
 const guide = L ? `<section class="block" id="blk-guide">
   <div class="block-head"><span class="block-ic">📺</span><div><div class="block-t">수업 자료</div><div class="block-s">강의 화면에 띄워 놓고 설명한 가이드예요. 강의를 보면서 같이 펼쳐 두세요.</div></div></div>
   ${L.materials.map((m,i)=>{const u=mediaUrl(m.file);return `<div class="mat"><span class="mat-ic">${m.kind==='extra'?'📎':'📄'}</span><div class="mat-info"><div class="mat-nm">${esc(m.name)}</div><div class="mat-sz">PDF · ${m.size}${m.kind==='extra'?' · 함께 읽을 자료':''}</div></div>
    <div class="acts">${u?`<button class="btn btn-ghost btn-sm" onclick="openRes('guide',${cur.n},${i})">보기</button><a class="btn btn-primary btn-sm" href="${u}" download onclick="markRes('guide',${cur.n})">받기</a>`:'<button class="btn btn-ghost btn-sm" disabled>준비 중</button>'}</div></div>`;}).join('')}
 </section>` : `<section class="block"><div class="block-head"><span class="block-ic">📺</span><div><div class="block-t">수업 자료</div><div class="block-s">이 강의 자료는 아직 올리지 않았어요.</div></div></div></section>`;
 const fi = L && L.fiche;
 const fu = fi ? ficheUrl(fi.file) : '';
 const fiche = fi ? `<section class="block fiche" id="blk-fiche">
   <div class="fiche-top">
     <div class="f-cover"><button class="fiche-cover" onclick="openRes('fiche',${cur.n},1)" aria-label="학습지 열기">${thumbUrl(fi.key,1)?`<img src="${thumbUrl(fi.key,1)}" alt="">`:''}<span class="pg">${fi.pages}쪽</span></button></div>
     <div class="f-head">
       <div class="fiche-kicker">📘 ${cur.n}일차 학습지 · 복습 · 문제 풀이</div>
       <div class="fiche-hook">${esc(fi.hook)}</div>
       <div class="fiche-sub">${esc(fi.sub)}</div>
     </div>
     <div class="fiche-idea"><b>핵심 아이디어</b>${esc(fi.idea)}</div>
     <div class="fiche-btns">${fu?`<button class="btn btn-primary" onclick="openRes('fiche',${cur.n},1)">학습지 펼치기</button><a class="btn btn-ghost" href="${fu}" download onclick="markRes('fiche',${cur.n})">PDF 받기</a>`:'<button class="btn btn-ghost" disabled>준비 중</button>'}</div>
   </div>
   <ul class="fiche-flow">${fi.flow.map(r=>`<li><span class="pp">${esc(r[0])}</span><span>${esc(r[1])}</span></li>`).join('')}</ul>
   ${fu?`<div class="fiche-thumbs">${[2,3].map(p=>`<button onclick="openRes('fiche',${cur.n},${p})" aria-label="${p}쪽"><img src="${thumbUrl(fi.key,p)}" alt="" loading="lazy"></button>`).join('')}<button class="more" onclick="openRes('fiche',${cur.n},1)">전체 펼치기<small>${fi.pages}쪽 · 문제 · 정답</small></button></div>`:''}
   <div class="fiche-how">
     <div class="how"><b>🎧 바쁠 때 · 이동할 때</b>강의를 눈과 귀로 먼저 익혀요. 학습지는 표지와 흐름만 훑어도 충분해요.</div>
     <div class="how"><b>✍️ 여유 있을 때</b>요약 부분을 다시 읽고, 마지막 부의 연습 문제 · 심화 문제를 풀고 정답과 해설로 확인해요.</div>
   </div>
 </section>` : '';
 const completeBar = done
  ? `<div class="complete-bar done"><div class="t"><b>✓ ${cur.n}일차 완료</b><span>${next?`${next}일차가 열려 있어요.`:'다음 강의를 기다리고 있어요.'}</span></div>${next?`<button class="btn btn-primary" onclick="openChapter(${next})">다음 강의 →</button>`:''}</div>`
  : `<div class="complete-bar"><div class="t"><b>이 강의를 다 들었나요?</b><span>완료하면 ${cur.n<TOTAL?`${cur.n+1}일차가 열리고`:''} 진도에 반영돼요. 학습지는 나중에 풀어도 괜찮아요.</span></div><button class="btn btn-primary" onclick="completeCh(${cur.n})">✓ 강의 완료</button></div>`;

 const cc=currentCh();
 const groups=WEEKS.map(wk=>{
  const ns=wk.chapters.map(c=>c[0]);
  const open=ns.includes(cur.n);
  const dn=ns.filter(isDone).length;
  const rows=wk.chapters.map(c=>{
   const st=chState(c[0]), playing=c[0]===cur.n, has=!!LESSONS[c[0]];
   return `<div class="chl ${playing?'playing':''} ${st==='lock'?'locked':''}" onclick="openChapter(${c[0]})">
     <div class="cn cn-${st}">${st==='done'?'✓':c[0]}</div>
     <div class="chl-info"><div class="chl-nm ${st==='lock'?'dim':''}">${esc(c[1])}</div><div class="chl-dur">${c[0]}일차 · ${c[2]}${st==='lock'?' · 🔒':c[0]===cc&&!playing?' · 지금 들을 차례':''}</div>
      ${has||MISSION_CH.has(c[0])?`<div class="chl-tags">${has?'<span class="chl-tag f">학습지</span>':''}${MISSION_CH.has(c[0])?'<span class="chl-tag">미션</span>':''}</div>`:''}</div></div>`;
  }).join('');
  return `<div class="chl-group ${open?'open':''}"><button class="chl-wk" onclick="this.parentElement.classList.toggle('open')"><b>${wk.n}주차 · ${esc(wk.title)}</b><small>${dn}/5</small><span class="jchev">▾</span></button><div class="chl-rows">${rows}</div></div>`;
 }).join('');
 const bonus=`<div class="chl-group"><button class="chl-wk" onclick="this.parentElement.classList.toggle('open')"><b>보너스 유닛</b><small>완주 후</small><span class="jchev">▾</span></button>
   <div class="chl-rows">${BONUS.map((b,i)=>`<div class="chl locked"><div class="cn cn-lock">B${i+1}</div><div class="chl-info"><div class="chl-nm dim">${esc(b[0])}</div><div class="chl-dur">${b[1]} · 40일차 완주 후 열림 · 🔒</div></div></div>`).join('')}</div></div>`;

 return `
 <div class="page-head"><h1 class="page-title">강의실</h1><p class="page-desc">${cur.w.n}주차 · ${esc(cur.w.title)}</p></div>
 <div class="player-wrap">
   <div>
     <div class="video-box">${video}</div>
     ${url?`<div class="speed-row"><span class="lab">속도</span>${[1,1.25,1.5].map(s=>`<button class="spd ${s===1?'active':''}" onclick="setSpeed(${s},this)">${s}×</button>`).join('')}${P.pos[cur.n]>30&&!done?`<button class="resume" id="resumeBtn" onclick="resume(${cur.n})">⏯ ${fmtT(P.pos[cur.n])}부터 이어 보기</button>`:''}</div>`:''}
     <div class="player-meta">
       <div class="pm-week">${cur.w.n}주차 · ${cur.n}일차</div>
       <div class="pm-title">${esc(cur.t)}</div>
       <div class="pm-meta-row"><span class="pill">${cur.dur}</span>${L?'<span class="pill brick">학습지 포함</span>':''}${L&&L.vtt?'<span class="pill">요약 자막</span>':''}${done?'<span class="pill ok">✓ 완료</span>':''}</div>
       ${L?steps:''}
       ${completeBar}

       </div>

   </div>
   <aside class="chlist-panel"><div class="chl-head">전체 커리큘럼 <span>${doneCount()} / ${TOTAL} 완료</span></div>${groups}${bonus}</aside>

function scrollToId(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
function setSpeed(s,btn){ const v=document.getElementById('vid'); if(v) v.playbackRate=s; document.querySelectorAll('.spd').forEach(b=>b.classList.toggle('active',b===btn)); }
function resume(n){ const v=document.getElementById('vid'); if(!v) return; v.currentTime=P.pos[n]||0; v.play().catch(()=>{}); document.getElementById('resumeBtn')?.remove(); }
let lastSave=0;
function bindVideo(){
 const v=document.getElementById('vid'), n=curPlaying;
 if(jumpTo){ const id=jumpTo==='fiche'?'blk-fiche':jumpTo; jumpTo=null; setTimeout(()=>scrollToId(id),80); }
 if(!v) return;
 v.addEventListener('timeupdate',()=>{
  if(!v.duration) return;
  const now=Date.now();
  if(now-lastSave>4000){ lastSave=now; P.pos[n]=v.currentTime; saveP(); }
  if(!P.watched[n] && v.currentTime/v.duration>0.9){ P.watched[n]=true; saveP(); refreshSteps(); toast('강의를 거의 다 들었어요 👏 완료를 눌러 다음 강의를 열어요'); }
 });
 v.addEventListener('ended',()=>{ P.watched[n]=true; P.pos[n]=0; saveP(); refreshSteps(); });
 v.addEventListener('error',()=>{
  const box=v.parentElement; box.innerHTML=`<div class="video-msg">영상을 불러오지 못했어요.<br>강의플랫폼열기.bat 으로 연 로컬 주소인지, 영상 파일이 upload 폴더에 그대로 있는지 확인해 주세요.</div>`;
 });
}
function stopVideo(){ const v=document.getElementById('vid'); if(v){ try{ const c=+v.dataset.ch; if(v.currentTime>5&&!isDone(c)) P.pos[c]=v.currentTime; saveP(); v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} } }
function refreshSteps(){
 const n=curPlaying, s=document.querySelectorAll('.step');
 if(s.length!==3) return;
 [[P.watched[n],1],[P.guide[n],2],[P.fiche[n],3]].forEach(([ok,i],k)=>{ s[k].classList.toggle('done',!!ok); s[k].querySelector('.step-n').textContent=ok?'✓':i; });
}
function markRes(kind,n){ (kind==='fiche'?P.fiche:P.guide)[n]=true; saveP(); refreshSteps(); }
function completeCh(n){
 if(!isDone(n)){ P.done.push(n); P.watched[n]=true; saveP(); }
 renderNav();
 const next=n+1;
 toast(n===5?'1주차 완주! 미션이 열렸어요 🎉':`${n}일차 완료! ${next}일차가 열렸어요`);
 show('classroom');
}

/* PDF 보기 — PC 는 화면 안에서, 휴대폰은 새 탭에서 엽니다 */
function openRes(kind,n,i){
 const L=LESSONS[n]; if(!L) return;
 if(kind==='guide'){ const m=L.materials[i]; const u=mediaUrl(m.file); if(u) openPdf(u,m.name,'guide',n); }
 else { const u=ficheUrl(L.fiche.file); if(u) openPdf(u+(i>1?'#page='+i:''),n+'일차 학습지','fiche',n); }
}
function openPdf(url,title,kind,n){
 markRes(kind,n);
 const touch = window.matchMedia('(max-width:1023px), (pointer:coarse)').matches;
 if(touch){ window.open(url,'_blank','noopener'); return; }
 const d=document.createElement('div'); d.className='viewer'; d.id='viewer';
 const clean=url.split('#')[0];
 d.innerHTML=`<div class="viewer-bar"><span class="t">${esc(title)}</span><a href="${clean}" target="_blank" rel="noopener">새 탭</a><a href="${clean}" download>받기</a><button onclick="closePdf()">닫기 ✕</button></div><iframe src="${url}" title="${esc(title)}"></iframe>`;
 document.body.appendChild(d); document.body.style.overflow='hidden';
}
function closePdf(){ document.getElementById('viewer')?.remove(); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePdf(); });

  <button class="btn btn-primary btn-block" onclick="P.missionSent=true;saveP();renderNav();show('mission');toast('미션을 제출했어요 (예시)')">인증 제출하기</button>`;

 }
 const badge = P.missionSent?'<span class="mbadge mb-pending">검토 대기 중</span>':open?'<span class="mbadge mb-open">열림 · D-4</span>':'<span class="mbadge mb-pending">🔒 5일차를 들으면 열려요</span>';
 const locked = MISSIONS.slice(1).map(x=>`<div class="mcard" style="opacity:.6"><div class="mcard-head"><div class="mch-wk">${x.wk}주차 미션</div><div class="mch-t">${esc(x.title)}</div><span class="mbadge mb-pending">🔒 ${esc(x.desc)}</span></div></div>`).join('');
 return `<div class="page-head"><h1 class="page-title">미션</h1><p class="page-desc">주차 마지막 강의를 들으면 미션이 열려요. 인증하면 두우리 쌤이 피드백을 남겨요.</p></div>
 <div class="mcard"><div class="mcard-head"><div class="mch-wk">1주차 미션</div><div class="mch-t">${esc(m.title)}</div>${badge}</div><div class="mcard-body">${body}</div></div>

/* ════════════════ Q&A ════════════════ */
function qaMatch(q){
 if(qaQuery){const s=(q.title+q.excerpt+q.content).toLowerCase(); if(!s.includes(qaQuery.toLowerCase())) return false;}
 if(qaFilter==='all') return true; if(qaFilter==='unsolved') return !q.solved; return q.catType===qaFilter;
}
const EMPTY_Q='<div class="empty">찾는 질문이 없어요. 새로 질문해보세요!</div>';
function renderQA(){
 const list=QA.filter(qaMatch);
 return `<div class="page-head"><h1 class="page-title">Q&amp;A 게시판</h1><p class="page-desc">궁금한 걸 묻고, 함께 듣는 크루와 서로 답해요. 두우리 쌤도 함께 답변해요.</p></div>
 <div class="qa-toolbar">
   <div class="chips">${[['all','전체'],['q','질문'],['free','자유'],['unsolved','미해결']].map(([k,l])=>`<button class="chip ${qaFilter===k?'active':''}" onclick="qaFilter='${k}';show('qa')">${l}</button>`).join('')}</div>
   <div class="qa-search"><input class="field" style="padding:9px 13px" value="${esc(qaQuery)}" placeholder="검색 (예: Il y a, avoir)" oninput="qaSearch(this.value)"></div>
 </div>
 <div class="qa-actions"><button class="btn btn-primary" onclick="toast('질문 작성은 로그인 연결 후 열려요')">＋ 질문하기</button></div>
 <div class="qlist" id="qlist">${list.length?list.map(renderQRow).join(''):EMPTY_Q}</div>`;
}
function qaSearch(v){qaQuery=v;const l=QA.filter(qaMatch);document.getElementById('qlist').innerHTML=l.length?l.map(renderQRow).join(''):EMPTY_Q;}
function renderQRow(q){
 const n=q.answers.length;
 const solved=q.solved?`<span class="q-solved ${q.solvedBy==='teacher'?'t':''}">${q.solvedBy==='teacher'?'쌤 답변 채택':'해결됨'}</span>`:'';
 return `<button class="qrow" onclick="openQ(${q.id})">
   <span class="q-votes"><span class="q-ans-count ${n?'has':''}">${n}</span><span class="q-ans-lab">답변</span></span>
   <span class="q-body">
     <span class="q-cat ${q.catType==='free'?'free':''}">${q.cat}</span>
     <span class="q-title" style="display:block">${esc(q.title)}</span>
     <span class="q-excerpt">${esc(q.excerpt)}</span>
     <span class="q-meta">${ava(q.author,20)}<span>${esc(q.author)}${q.me?' (나)':''}</span><span>·</span><span>${q.ch}</span><span>·</span><span>${q.when}</span>${solved}</span>
   </span></button>`;
}
function openQ(id){openQId=id; if(view==='qa-detail') show('qa-detail'); else go('qa-detail');}
function renderQDetail(){
 const q=QA.find(x=>x.id===openQId)||QA[0];
 const ans=q.answers.map(a=>{
  const t=a.role==='teacher';
  return `<div class="ans ${t?'teacher':''} ${a.accepted?'accepted':''}">
    <div class="ans-top">${ava(a.name,34,t?'var(--brick)':null)}
      <span class="ans-nm">${esc(a.name)}${a.me?' (나)':''}</span>
      <span class="ans-role ${t?'role-teacher':'role-student'}">${t?'두우리 쌤':'수강생'}</span>
      ${a.accepted?'<span class="accepted-tag">✓ 채택된 답변</span>':`<span class="ans-dt">${a.when}</span>`}</div>
    <div class="ans-txt">${esc(a.text)}</div>
    ${a.tip?`<div class="ans-tip">${esc(a.tip)}</div>`:''}
    <div class="ans-actions"><button class="ans-act" onclick="toast('도움돼요 👍')">👍 도움돼요</button>${!a.accepted&&q.me?`<button class="ans-act" onclick="toast('채택했어요')">채택하기</button>`:''}</div>
  </div>`;
 }).join('') || '<div class="empty" style="margin-bottom:12px">아직 답변이 없어요. 첫 답변을 남겨보세요!</div>';
 const back = mode==='admin' ? 'a-qa' : 'qa';
 return `<button class="back-link" onclick="go('${back}')">${ic('back')} 게시판으로</button>
  <div class="qdetail">
    <span class="q-cat ${q.catType==='free'?'free':''}">${q.cat}</span>
    <div class="qd-title">${esc(q.title)}</div>
    <div class="qd-meta">${ava(q.author,20)}<span>${esc(q.author)}${q.me?' (나)':''}</span><span>·</span><span>${q.ch}</span><span>·</span><span>${q.when}</span></div>
    <div class="qd-content">${esc(q.content)}</div>
  </div>
  <div class="ans-head">답변 ${q.answers.length}</div>
  ${ans}
  <div class="composer">
    <textarea class="field" placeholder="${mode==='admin'?'두우리 쌤으로 답변을 남겨요…':'답변을 남겨보세요. 함께 듣는 크루에게 큰 도움이 돼요!'}"></textarea>
    <div class="composer-foot"><span class="composer-hint">${mode==='admin'?'쌤 답변은 강조 표시돼요':'수강생도 자유롭게 답변할 수 있어요'}</span>
      <button class="btn btn-primary btn-sm" onclick="toast('답변 등록은 로그인 연결 후 열려요')">답변 등록</button></div>
  </div>`;
}

/* ════════════════ 크루 ════════════════ */
function renderCrew(){
 const all=crew();
 const sorted=[...all].sort((a,b)=>b.done-a.done||(a.me?-1:1));
 const topCert=[...all].sort((a,b)=>b.cert-a.cert)[0];
 const inProg=all.filter(c=>c.done>0&&c.done<TOTAL).length, notStarted=all.filter(c=>c.done===0).length, fin=all.filter(c=>c.done>=TOTAL).length;
 const rows=sorted.map((c,i)=>`<div class="rank-row ${c.me?'me':''}">
    <div class="rk-num ${i<3?'top':''}">${i+1}</div>${ava(c.name,34,c.me?'var(--brick)':null)}
    <div class="rk-name">${esc(c.name)}${c.me?'<span class="me-tag">나</span>':''}${c.site?`<span class="site">↗ ${esc(c.site)}</span>`:''}</div>
    <div class="rk-prog"><div class="pbar"><i style="width:${Math.round(c.done/TOTAL*100)}%"></i></div><div class="rk-frac">${c.done} / ${TOTAL}</div></div>
  </div>`).join('');
 return `<div class="page-head"><h1 class="page-title">${mode==='admin'?'기수 랭킹':'함께하는 크루'}</h1><p class="page-desc">같은 3기에서 함께 달리는 크루예요. 서로 어디쯤인지 보며 끝까지 가요.</p></div>
 <div class="stat-grid">
   <div class="stat"><div class="stat-n">${all.length}</div><div class="stat-l">전체 크루</div></div>
   <div class="stat"><div class="stat-n">${inProg}</div><div class="stat-l">수강 중</div></div>
   <div class="stat"><div class="stat-n">${fin}</div><div class="stat-l">완주</div></div>
   <div class="stat"><div class="stat-n">${notStarted}</div><div class="stat-l">시작 전</div></div>
 </div>
 <div class="top-cert"><span class="tc-fire">🔥</span><div class="tc-info"><div class="tc-lab">학습지를 가장 많이 펼친 크루</div><div class="tc-name">${esc(topCert.name)}</div></div>
   <div class="tc-count"><b>${topCert.cert}</b><span>개</span></div></div>
 <div class="sect-title">진도율 순위 <span class="note">완료 강의 기준 · ${all.length}명</span></div>
 <div class="rank-table"><div class="rank-thead"><div style="width:26px;text-align:center">#</div><div style="width:34px"></div><div style="flex:1">크루</div><div style="width:240px;text-align:right">진도</div></div>${rows}</div>
 <div class="foot-note">표시 이름은 각자 정한 별명이에요. 나를 뺀 크루는 예시 데이터예요.</div>`;
}

/* ════════════════ 공지 ════════════════ */
function renderNotice(){
 return `<div class="page-head"><h1 class="page-title">공지사항</h1><p class="page-desc">챌린지 진행에 필요한 소식을 확인하세요</p></div>
 ${NOTICES.map(n=>`<div class="notice"><div class="n-top">${n.pin?'<span class="n-pin">필독</span>':''}<span class="n-t">${esc(n.t)}</span><span class="n-dt">${n.dt}</span></div><div class="n-ex">${esc(n.ex)}</div></div>`).join('')}`;
}

/* ════════════════ 운영자 ════════════════ */
function renderAdminStudents(){
 const all=crew(), sorted=[...all].sort((a,b)=>b.done-a.done);
 const avg=Math.round(all.reduce((s,c)=>s+c.done,0)/all.length/TOTAL*100);
 const unsolved=QA.filter(q=>!q.solved).length, waiting=REVIEWS.filter(r=>r.isNew).length;
 const rows=sorted.map(c=>{
  const pct=Math.round(c.done/TOTAL*100), wait=REVIEWS.some(r=>r.isNew&&r.name===c.name);
  return `<div class="stu-row">${ava(c.name,34)}<div class="stu-name">${esc(c.name)}</div>
   <div class="stu-prog"><div class="pbar"><i style="width:${pct}%"></i></div><span class="rk-frac">${c.done}/${TOTAL}</span></div>
   <div class="stu-tags"><span class="stu-tag">학습지 <strong>${c.cert}</strong></span>${wait?'<span class="miss-badge">미션 대기</span>':''}</div></div>`;
 }).join('');
 return `<div class="page-head"><h1 class="page-title">수강생 현황</h1><p class="page-desc">3기 수강생들의 진도와 미션 상태를 확인해요</p></div>
 <div class="stat-grid">
   <div class="stat hi"><div class="stat-n">${all.length}</div><div class="stat-l">전체 수강생</div></div>
   <div class="stat" style="cursor:pointer" onclick="go('a-mission')"><div class="stat-n">${waiting}</div><div class="stat-l">🔔 미션 대기</div></div>
   <div class="stat" style="cursor:pointer" onclick="go('a-qa')"><div class="stat-n">${unsolved}</div><div class="stat-l">💬 답변 대기 질문</div></div>
   <div class="stat"><div class="stat-n">${avg}%</div><div class="stat-l">평균 진도</div></div>
 </div>
 <div class="sect-title">진도 순위</div>
 <div class="stu-table">${rows}</div>`;
}
function renderAdminQA(){
 const list=[...QA].sort((a,b)=>(a.solved?1:0)-(b.solved?1:0));
 return `<div class="page-head"><h1 class="page-title">Q&amp;A 관리</h1><p class="page-desc">답변 안 된 질문이 위에 와요. 좋은 크루 답변은 채택해 주세요.</p></div>
 <div class="qlist">${list.map(renderQRow).join('')}</div>`;
}
function renderAdminMission(){
 return `<div class="page-head"><h1 class="page-title">미션 검토</h1><p class="page-desc">제출된 미션을 확인하고 피드백을 남겨요</p></div>
 ${REVIEWS.map(m=>`<div class="mcard"><div class="rv-head">${ava(m.name,30)}
    <div style="flex:1;min-width:0"><div class="mch-t">${esc(m.name)}</div><div class="mch-wk">${m.wk}</div></div>
    ${m.isNew?'<span class="mbadge mb-open" style="margin:0">NEW</span>':''}</div>
   <div class="mcard-body">
     ${m.files.map(f=>`<div class="mat"><span class="mat-ic">${/\.(m4a|mp3)$/.test(f)?'🎙️':f.endsWith('.mp4')?'🎬':f.endsWith('.pdf')?'📄':'🖼️'}</span><div class="mat-info"><div class="mat-nm">${esc(f)}</div></div><div class="acts"><button class="btn btn-ghost btn-sm" onclick="toast('파일 열기는 저장소 연결 후 돼요')">열기</button></div></div>`).join('')}
     <textarea class="field" style="min-height:74px;margin-top:6px" placeholder="피드백을 남겨주세요…"></textarea>
     <div class="rv-btns"><button class="btn btn-primary" onclick="toast('인증 승인 + 피드백 전송 (예시)')">✓ 인증 승인</button><button class="btn btn-ghost" onclick="toast('보류했어요')">보류</button></div>
   </div></div>`).join('')}`;
}
function renderUpload(){
 const w=WEEKS[upWeek-1];
 const tabs=WEEKS.map(x=>`<button class="chip ${x.n===upWeek?'active':''}" onclick="upWeek=${x.n};upCh=${x.chapters[0][0]};show('a-upload')">${x.n}주차</button>`).join('');
 const list=w.chapters.map(c=>{
  const has=!!LESSONS[c[0]];
  return `<button class="up-ch ${c[0]===upCh?'sel':''}" onclick="upCh=${c[0]};show('a-upload')"><span class="cn ${has?'cn-done':'cn-lock'}">${has?'✓':c[0]}</span>
    <span class="chl-info"><span class="chl-nm" style="display:block">${esc(c[1])}</span><span class="chl-dur" style="display:block">${c[0]}일차 · ${c[2]}</span></span>
    <span class="up-st ${has?'st-ok':'st-no'}">${has?'연결됨':'비어 있음'}</span></button>`;
 }).join('');
 const sel=chInfo(upCh), L=LESSONS[upCh];
 const row=(ok,label,val)=>`<div class="mat"><span class="mat-ic">${ok?'✅':'⬜'}</span><div class="mat-info"><div class="mat-nm">${label}</div><div class="mat-sz">${esc(val)}</div></div></div>`;
 const panel = L
  ? `${row(true,'강의 영상','upload\\'+L.video.replace(/\//g,'\\'))}
     ${L.materials.map(m=>row(true,'수업 자료',m.file.split('/').pop())).join('')}
     ${row(true,'학습지',L.fiche.file+' · '+L.fiche.pages+'쪽')}
     ${row(!!L.vtt,'요약 자막',L.vtt?'lecture.vtt':'없음 (5일차는 요약 자막 파일이 없어요)')}`
  : `<button class="upzone" onclick="toast('영상 저장소를 정하면 여기서 올릴 수 있어요')"><div class="ic">☁️</div><div class="t">클릭하거나 영상 파일을 끌어다 놓으세요<br><strong>MP4</strong></div></button>
     <div class="up-label">수업 자료 (PDF)</div>
     <button class="upzone" style="padding:16px" onclick="toast('PDF 올리기는 저장소 연결 후 돼요')"><div class="t" style="margin:0">📄 PDF 파일 첨부</div></button>
     <div class="up-label">학습지 (PDF)</div>
     <button class="upzone" style="padding:16px" onclick="toast('PDF 올리기는 저장소 연결 후 돼요')"><div class="t" style="margin:0">📘 학습지 파일 첨부</div></button>`;
 return `<div class="page-head"><h1 class="page-title">강의 업로드</h1><p class="page-desc">강의마다 영상 · 수업 자료 · 학습지 세 가지를 연결해요. 1주차가 기준 틀이에요.</p></div>
 <div class="wk-tabs">${tabs}</div>
 <div class="up-layout">
   <div class="up-list">${list}</div>
   <div class="up-panel">
     <div class="up-sel">${sel.n}일차 · ${esc(sel.t)}</div>
     <div class="up-sel-sub">${sel.w.n}주차 · ${esc(sel.w.title)} · ${sel.dur}</div>
     ${panel}
   </div>
 </div>`;
}

/* ════════════════ 시작 ════════════════ */
document.getElementById('bellIc').innerHTML=ic('bell');
document.getElementById('homeLink').setAttribute('href',homeHref());
window.addEventListener('beforeunload',()=>{ const v=document.getElementById('vid'); if(v&&v.currentTime>5){ P.pos[+v.dataset.ch]=v.currentTime; saveP(); } });
(function init(){
 const h=location.hash.slice(1);
 if(ADMIN_VIEWS.has(h)) mode='admin';
 syncModeUI();
 show(h||DEFAULT[mode]);
})();
</script>
</body>
</html>
